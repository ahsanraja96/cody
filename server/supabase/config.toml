# Supabase CLI settings for the Tabfold Pro server. Run `supabase` commands from the server/ folder.
project_id = "tabfold"

[functions.tabfold]
# The function checks each computer's device token itself, and Stripe's webhook signature.
# Supabase's own sign-in check would turn both away: neither the extension nor Stripe signs in to
# Supabase.
verify_jwt = false
